---
ansible-navigator:
  execution-environment:
    # container-options:
      # - --net=host
    # image: quay.io/openshift-examples/kubevirt-ansible-ee:202312291719
    image: quay.coe.muc.redhat.com/stormshift/automation-execution-environment:202602021722
    environment-variables:
      pass:
        - KUBECONFIG
        - K8S_AUTH_KUBECONFIG
    volume-mounts:
      # Just needed for the upload
      #- src: "/home/rbohne/virt-ansible-demo"
      #  dest: "/home/rbohne/virt-ansible-demo"
      #  options: "Z"
  logging:
    level: info
  mode: stdout
  playbook-artifact:
    enable: true
    save-as: /tmp/example-openshift-kubevirt-{playbook_name}-artifact-{time_stamp}.json
